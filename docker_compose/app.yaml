services:
  main-app:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
    container_name: main-app
    ports:
      - "${API_PORT}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: "uvicorn --factory presentation.api.main:create_app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../app/:/app/
    networks:
      - backend
  
  consumer:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
    container_name: consumer
    network_mode: host
    command: "python -m presentation.consumer.main"
    env_file:
      - ../.env
    environment:
      RABBITMQ_HOST: 127.0.0.1
    volumes:
      - ../app/:/app/
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  backend:
    driver: bridge